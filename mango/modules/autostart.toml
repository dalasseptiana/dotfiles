[global]

exec_once = ["dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE MOZ_ENABLE_WAYLAND"]
exec_once = ["/usr/libexec/xdg-desktop-portal"]
exec_once = ["/usr/libexec/xdg-desktop-portal-wlr"]
exec_once = ["/usr/libexec/polkit-gnome-authentication-agent-1"]
exec_once = ["brightnessctl -d amdgpu_bl0 set 100%"]
exec_once = ["pipewire"]
exec_once = ["pipewire-pulse"]
exec_once = ["wireplumber"]
exec_once = ["swayidle -w timeout 300 'swaylock -C ~/dotfiles/mango/modules/lock.conf' timeout 600 'wlopm --off *' resume 'wlopm --on *' timeout 800 'loginctl suspend' resume 'wlopm --on *' before-sleep 'swaylock -C ~/dotfiles/mango/modules/lock.conf'"]
exec_once = ["swaybg -i ~/.local/share/walls/bg.jpg"]
exec_once = ["waybar"]
exec_once = ["dunst"]
exec_once = ["swaylock -C ~/dotfiles/mango/modules/lock.conf"]
