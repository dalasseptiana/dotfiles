[bind.default]
"SUPER+Return" = "spawn,ghostty"
"SUPER+d" = "spawn,~/dotfiles/rofi/launcher.sh"
"SUPER+m" = "spawn,~/dotfiles/rofi/powermenu.sh"
"SUPER+w" = "spawn,~/dotfiles/mango/modules/togglebar.sh"
"SUPER+b" = "spawn,helium"
"SUPER+e" = "spawn,thunar"
"SUPER+s" = "spawn,spotify"
"SUPER+n" = "spawn,ghostty -e impala"
"SUPER+c" = "spawn,/opt/helium/helium-wrapper --profile-directory=Default --app-id=hnpfjngllnobngcgfapefoaidbinmjnm"
"SUPER+q" = "killclient,"
"SUPER+SHIFT+r" = "reload_config"

# switch window focus
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"
"SUPER+k" = "focusdir,up"
"SUPER+j" = "focusdir,down"

# move window
"SUPER+SHIFT+h" = "move_client,left"
"SUPER+SHIFT+l" = "move_client,right"
"SUPER+SHIFT+k" = "move_client,up"
"SUPER+SHIFT+j" = "move_client,down"

# switch window status
"SUPER+v" = "togglefloating,"
"SUPER+f" = "togglemaximizescreen,"
"SUPER+SHIFT+f" = "togglefullscreen,"
"ALT+SHIFT+f" = "togglefakefullscreen,"
"SUPER+comma" = "minimized,"
"SUPER+SHIFT+comma" = "restore_minimized"
"SUPER+space" = "toggle_scratchpad"

# tag switch
"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"
"SUPER+0" = "view,10,0"

# tag move client to the tag and focus it
"SUPER+SHIFT+1" = "tag,1,0"
"SUPER+SHIFT+2" = "tag,2,0"
"SUPER+SHIFT+3" = "tag,3,0"
"SUPER+SHIFT+4" = "tag,4,0"
"SUPER+SHIFT+5" = "tag,5,0"
"SUPER+SHIFT+6" = "tag,6,0"
"SUPER+SHIFT+7" = "tag,7,0"
"SUPER+SHIFT+8" = "tag,8,0"
"SUPER+SHIFT+9" = "tag,9,0"
"SUPER+SHIFT+0" = "tag,10,0"

# monitor switch
"alt+shift+Left" = "focusmon,left"
"alt+shift+Right" = "focusmon,right"
"SUPER+Alt+Left" = "tagmon,left"
"SUPER+Alt+Right" = "tagmon,right"

# resizewin
"SUPER+CTRL+k" = "resizewin,+0,-50"
"SUPER+CTRL+j" = "resizewin,+0,+50"
"SUPER+CTRL+h" = "resizewin,-50,+0"
"SUPER+CTRL+l" = "resizewin,+50,+0"

# brightness
"XF86MonBrightnessDown" = "spawn,brightnessctl set 5%-"
"XF86MonBrightnessUp" = "spawn,brightnessctl set 5%+"

# volume
"XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioRaiseVolume" = "spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioMicMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"

# screenshot
"NONE+Print" = "spawn,~/.config/mango/modules/screenshot.sh area"
"SHIFT+Print" = "spawn,~/.config/mango/modules/screenshot.sh full"

[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"btn_middle" = "togglemaximizescreen,0"
"SUPER+btn_right" = "moveresize,curresize"

[axisbind.default]
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"

[gesturebind.default]
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+right+4" = "viewprev_have_client"
"none+left+4" = "viewnext_have_client"
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"
