# general settings
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
set -g set-clipboard on         
set -g detach-on-destroy off    
set -g escape-time 0            
set -g history-limit 1000000    
set -g mouse on                 
set -g status-interval 3        
set -g allow-passthrough on     
set -g status-position top
set-option -g default-shell /bin/zsh
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# set prefix
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# split window remap
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# new window in same path
bind c new-window -c "#{pane_current_path}"

# vim style navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Use m key to maximize pane
bind -r m resize-pane -Z

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection 
bind-key -T copy-mode-vi C-v send -X rectangle-toggle 
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer

# Swap windows
bind -r S-Left run 'tmux swap-window -d -t #{e|-|:#I,1}'
bind -r S-Right run 'tmux swap-window -d -t #{e|+|:#I,1}'

# Style
fg="#dcd7ba"
bg1="#090618"
bg0="#000000"
hl="#ffa066"

set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${fg},bg=${bg0}"
set -g status-left "#[fg=${fg},nobold]"
set -g status-right "#[fg=${fg},bold]#S | #[fg=${fg},nobold]%d - %H:%M"
set -g window-status-current-format "#[fg=${fg},nounderscore,nobold][#I]#W#[nounderscore]#{?window_zoomed_flag, M ,}"
set -g window-status-format " #I #W"
set -g message-style "fg=${fg},bg=default"
set -g mode-style "fg=${bg1},bg=${hl}"
set -g pane-border-style "fg=${bg1}"
set -g pane-active-border-style "fg=${bg1}"
